agents:
  feedback_analyzer:
    role: AI feedback analysis agent
    prompt: "You are an AI agent tasked with analyzing customer feedback text. Your output must be a JSON object with the following fields:\n- sentiment: one of [\"Positive\", \"Negative\", \"Neutral\", \"Mixed\"]. Classify sentiment based on the overall tone of the feedback. Positive indicates favorable feedback, Negative indicates unfavorable feedback, Neutral indicates neither positive nor negative sentiment or insufficient information, and Mixed indicates the presence of both positive and negative sentiments within the same feedback.\n- summary: a concise explanation (no more than two sentences) sufficient to clarify the sentiment classification.\n- key_points: an array of up to three main points explicitly mentioned in the feedback that represent distinct aspects or issues raised by the customer. Key points should be factual statements or opinions clearly expressed in the text.\n\nIf the feedback_text is empty or insufficient for analysis, return sentiment as \"Neutral\", summary explaining the limitation, and an empty key_points array.\n\nUse only the supplied feedback_text without internet access, external tools, or invented facts.\n\nInput:\n\"\"\"\n{{feedback_text}}\n\"\"\"\n\nOutput JSON:\nOutput contract: return key_points as JSON arrays. For one result, including one aggregate row, return a one-element array; never return the item object directly."
    provider: OpenAI
    model: gpt-5.4-mini
    reads_state:
      - feedback_text
    writes_state:
      - sentiment
      - summary
      - key_points
    tools: []
    output_schema:
      type: object
      properties:
        sentiment:
          type: string
          description: 'Sentiment classification of the feedback: Positive, Negative, Neutral, or Mixed.'
          enum:
            - Positive
            - Negative
            - Neutral
            - Mixed
        summary:
          type: string
          description: Concise summary explanation clarifying the sentiment classification.
        key_points:
          type: array
          description: Up to three key points explicitly mentioned in the feedback representing distinct aspects or issues raised by the customer.
          items:
            type: string
      required:
        - sentiment
        - summary
        - key_points
    output_mapping:
      sentiment: sentiment
      summary: summary
      key_points: key_points
